server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # O backend deve ser acessado via proxy reverso se estiver no mesmo domínio,
    # mas como o Spring Boot já lida com /anota-corts, o Nginx externo na EC2
    # deve gerenciar o roteamento entre este container e o do backend.

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
