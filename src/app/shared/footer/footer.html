<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <a routerLink="/" class="footer-logo">
        <span class="logo-accent">{{ brand.logoAccent }}</span>{{ brand.logoRest }}
      </a>
      <p class="footer-copy">{{ t.copy }}</p>
      <p class="footer-version">
        <span class="version-badge">v{{ appVersion.version }}</span>
        <span>{{ appVersion.releaseDate }}</span>
      </p>
    </div>

    <nav class="footer-links" aria-label="Links do rodapé">
      @for (link of t.links; track link.route) {
        <a [routerLink]="link.route" class="footer-link">{{ link.label }}</a>
      }
    </nav>
  </div>
</footer>
