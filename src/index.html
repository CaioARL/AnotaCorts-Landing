<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>AnotaCorts - Gestão Digital para sua Barbearia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AnotaCorts: app completo de gestão para barbearias. Agendamentos, clientes, despesas, dashboard financeiro e ranking. Disponível para Android e iOS."
    />
    <meta name="theme-color" content="#080c14" />
    <!-- Título, descrição, canonical e og/twitter de cada rota: src/app/config/seo.json
         (scripts/prerender-seo.js grava os valores de cada página no build) -->
    <link rel="canonical" href="https://www.anotacorts.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AnotaCorts" />
    <meta property="og:title" content="AnotaCorts - Gestão Digital para sua Barbearia" />
    <meta
      property="og:description"
      content="AnotaCorts: app completo de gestão para barbearias. Agendamentos, clientes, despesas, dashboard financeiro e ranking. Disponível para Android e iOS."
    />
    <meta property="og:url" content="https://www.anotacorts.com.br/" />
    <meta property="og:image" content="https://www.anotacorts.com.br/AnotaCorts.png" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnotaCorts - Gestão Digital para sua Barbearia" />
    <meta
      name="twitter:description"
      content="AnotaCorts: app completo de gestão para barbearias. Agendamentos, clientes, despesas, dashboard financeiro e ranking. Disponível para Android e iOS."
    />
    <meta name="twitter:image" content="https://www.anotacorts.com.br/AnotaCorts.png" />

    <!-- Ícones quadrados e opacos (o Google exibe o favicon num círculo; múltiplos de 48px) -->
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <!-- Boxicons: baixa com prioridade baixa (media="print") e só então vale para a tela, sem
         bloquear a primeira pintura nem disputar banda com o topo (nenhum ícone fica no topo) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2"
      crossorigin="anonymous"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        integrity="sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2"
        crossorigin="anonymous"
        rel="stylesheet"
      />
    </noscript>
    <!-- O CSS do MapLibre é carregado pelo próprio globo (globe-map.ts), só na home -->

    <!-- Imagem principal da home (LCP): começa a baixar junto com o HTML.
         data-home-only: scripts/prerender-seo.js tira esta tag das outras páginas -->
    <link
      rel="preload"
      as="image"
      href="mobile2-720.webp"
      imagesrcset="mobile2-480.webp 480w, mobile2-720.webp 720w, mobile2-1024.webp 1024w"
      imagesizes="(max-width: 640px) 360px, (max-width: 900px) 420px, 540px"
      fetchpriority="high"
      data-home-only
    />

    <!-- Structured Data (schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "AnotaCorts",
        "operatingSystem": "ANDROID, IOS",
        "applicationCategory": "BusinessApplication",
        "description": "App completo de gestão para barbearias: agendamentos, clientes, despesas e dashboard financeiro.",
        "url": "https://www.anotacorts.com.br/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
      }
    </script>

    <!-- SPA fallback do GitHub Pages: restaura a rota codificada pelo 404.html -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
